[package]
name = "essus-portfolio"
version = "0.0.1"
edition = "2021"
authors = ["Yamil Essus <essusyamil@gmail.com>"]

[dependencies]
dioxus = { version = "0.6.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
